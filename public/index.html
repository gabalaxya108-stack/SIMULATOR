<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COA Arithmetic Expression Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white py-4">
          <h1 class="h3 mb-1">COA Arithmetic Expression Simulator</h1>
          <p class="mb-0 opacity-75">Validate, convert, and simulate arithmetic expressions in multiple instruction formats.</p>
        </div>
        <div class="card-body p-4 p-lg-5">
          <div class="row g-4">
            <div class="col-12">
              <label for="expression" class="form-label fw-semibold">Arithmetic Expression</label>
              <textarea id="expression" class="form-control form-control-lg" rows="3" placeholder="Example: a+b*(c-d)"></textarea>
            </div>
            <div class="col-12">
              <div class="d-flex flex-wrap gap-2">
                <button id="validateBtn" class="btn btn-outline-primary">Validate</button>
                <button id="generateBtn" class="btn btn-primary">Generate & Execute</button>
                <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
              </div>
            </div>
            <div class="col-12">
              <div id="messageBox" class="alert d-none" role="alert"></div>
            </div>
            <div id="variableSection" class="col-12 d-none">
              <div class="card border-0 bg-light">
                <div class="card-body">
                  <h2 class="h5">Variable Inputs</h2>
                  <div id="variableInputs" class="row g-3"></div>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div id="results" class="d-none">
                <div class="card border-0 shadow-sm mb-4">
                  <div class="card-body">
                    <h2 class="h5">Expression Summary</h2>
                    <p class="mb-2"><strong>Postfix:</strong> <span id="postfixValue"></span></p>
                    <p class="mb-0"><strong>Variables Used:</strong> <span id="variablesValue"></span></p>
                  </div>
                </div>
                <div class="row g-4" id="formatCards"></div>
                <div class="card border-0 shadow-sm mt-4">
                  <div class="card-body">
                    <h2 class="h5">Comparison Table</h2>
                    <div class="table-responsive">
                      <table class="table table-bordered align-middle mb-0">
                        <thead class="table-primary">
                          <tr><th>Format</th><th>Instruction Count</th><th>Registers / Stack</th><th>Temporary Variables</th><th>Final Result</th></tr>
                        </thead>
                        <tbody id="comparisonTableBody"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
